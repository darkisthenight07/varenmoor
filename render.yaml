services:
  - type: web
    name: varenmoor-api
    runtime: python
    plan: free
    buildCommand: pip install ".[web]"
    startCommand: uvicorn varenmoor.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"   # tighten to your Vercel URL after first deploy
      - key: MEMORY_STORE_DIR
        value: /tmp/memory_store
