<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Varenmoor</title>
<style>
:root{--bg:#0d0b0e;--fg:#d8d0c8;--dim:#8a7f78;--acc:#a33;--card:#17131a}
@media(prefers-color-scheme:light){:root{--bg:#f2ede8;--fg:#201a1a;--dim:#6b605a;--acc:#8b2020;--card:#e6dfd8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,serif;display:flex;flex-direction:column;height:100dvh}
header{padding:12px 18px;border-bottom:1px solid var(--card);letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:18px;max-width:760px;width:100%;margin:0 auto}
.m{margin:0 0 16px;white-space:pre-wrap}.n{color:var(--dim);font-style:italic}.who{font-weight:bold;color:var(--acc);display:block;font-size:13px;letter-spacing:.1em}
.you{text-align:right}.sys{color:var(--dim);font-size:14px;text-align:center}.stage{border-top:1px solid var(--card);padding-top:12px;color:var(--dim)}
form{display:flex;gap:8px;padding:12px 18px;max-width:760px;width:100%;margin:0 auto}
input{flex:1;padding:10px;background:var(--card);color:var(--fg);border:1px solid var(--dim);border-radius:6px;font:inherit}
button{padding:10px 16px;background:var(--acc);color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.5}
</style></head><body>
<header>Varenmoor</header>
<div id="log"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Your name to begin (or leave blank)…" autofocus>
<button id="go">Enter</button></form>
<script src="config.js"></script>
<script>
const API=(window.VARENMOOR_API||"").replace(/\/$/,""),log=document.getElementById("log"),t=document.getElementById("t"),go=document.getElementById("go");
let sid=null,busy=false,ended=false;
function add(cls,text,who){const d=document.createElement("div");d.className="m "+cls;if(who){const w=document.createElement("span");w.className="who";w.textContent=who;d.append(w)}d.append(document.createTextNode(text));log.append(d);log.scrollTop=log.scrollHeight}
async function call(path,body){const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
function show(events){for(const e of events){if(e.kind==="narration")add("n",e.text);else if(e.kind==="say")add("",e.text,e.speaker.toUpperCase());else if(e.kind==="end"){add("sys","— THE END —");ended=true}}}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();if(busy)return;const text=t.value.trim();
 try{busy=t.disabled=go.disabled=true;
  if(!sid){add("sys","Waking the castle… (the first request can take ~30s on free hosting)");const r=await call("/api/session",{player:text});sid=r.session_id;t.value="";t.placeholder="Say or do something…";show(r.events)}
  else if(text){add("you",text,"YOU");t.value="";show((await call(`/api/session/${sid}/message`,{text})).events)}
 }catch(err){add("sys","⚠ "+err.message)}finally{busy=false;if(!ended){t.disabled=go.disabled=false;t.focus()}}};
</script></body></html>
