<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varenmoor — An Interactive Adventure Story</title>
<meta name="description" content="Step into Varenmoor, an atmospheric interactive story where your words shape what happens next.">
<meta property="og:title" content="Varenmoor — An Interactive Adventure Story">
<meta property="og:description" content="Step into Varenmoor, an atmospheric interactive story where your words shape what happens next.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  --background: #17191A;
  --foreground: #D8D5CF;
  --card: #202324;
  --primary: #A39379;
  --muted-foreground: #9FA7A8;
  --destructive: #C4877E;
  --pewter: #748186;
  --fine-rule: color-mix(in oklab, var(--pewter) 30%, transparent);
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: Karla, Arial, sans-serif;
  --font-ui: Karla, Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: Georgia, serif; }
button, input { font: inherit; }
::selection { background: var(--primary); color: var(--background); }
.game-shell { min-height: 100dvh; display: flex; flex-direction: column; background: var(--background); }
.site-header { height: 64px; flex: none; border-bottom: 1px solid var(--fine-rule); }
.site-header-inner { height: 100%; max-width: 1440px; padding: 0 5%; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.wordmark { display: inline-flex; align-items: center; gap: 13px; color: var(--foreground); text-decoration: none; font: 600 26px/1 var(--font-display); white-space: nowrap; cursor: pointer; background: none; border: 0; padding: 0; }
.wordmark-mark { display: grid; place-items: center; width: 60px; height: 60px; border: 1px solid var(--primary); color: var(--primary); font: italic 23px/1 var(--font-display);}
.header-right { display: flex; align-items: center; gap: 24px; }
.header-edition { font: 10px/1 var(--font-ui); letter-spacing: .18em; color: var(--muted-foreground); }
.restart-button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; cursor: pointer; color: var(--muted-foreground); font: 11px var(--font-ui); letter-spacing: .08em; padding: 6px 0; }
.restart-button:hover { color: var(--foreground); }
.restart-button svg { width: 14px; height: 14px; }
.main-content { flex: none; }
.scene { overflow: hidden; position: relative; border-bottom: 1px solid var(--fine-rule); background: var(--background); }
.scene-image-frame { position: relative; height: clamp(215px, 27vw, 375px); overflow: hidden; display: grid; place-items: center; background: var(--background); }
.scene-image { position: relative; z-index: 1; display: block; width: min(100%, 900px); height: 100%; object-fit: contain; -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); }
.scene-title { position: relative; max-width: 900px; padding: 9px 30px 36px; margin: auto; }
.chapter-label, .transcript-heading { display: flex; align-items: center; gap: 14px; color: var(--primary); font: 600 10px/1 var(--font-ui); letter-spacing: .25em; }
.chapter-rule { flex: none; height: 1px; width: 45px; background: var(--primary); }
.scene h1 { margin: 13px 0 0; font: italic 400 clamp(66px, 7vw, 106px)/.85 var(--font-display); color: var(--foreground); }
.reading-area { width: min(100%, 900px); margin: 0 auto; padding: 0 30px; }
.welcome-content { width: min(100%, 660px); margin: 0 auto; padding: 43px 0 25px; }
.section-label { margin: 0 0 12px; color: var(--pewter); font: 600 10px/1 var(--font-ui); letter-spacing: .25em; }
.welcome-content h2 { margin: 0; font: 400 clamp(35px, 4vw, 49px)/1.06 var(--font-display); }
.welcome-description { max-width: 550px; margin: 14px 0 0; color: var(--muted-foreground); font: 17px/1.65 var(--font-body); }
.composer-wrap { width: 100%; padding: 0 30px 45px; }
.composer-inner { width: min(100%, 660px); margin: auto; border-top: 1px solid var(--fine-rule); padding-top: 22px; }
.composer-form { display: flex; align-items: end; gap: 22px; }
.composer-input-wrap { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--pewter); transition: border-color .25s; }
.composer-input-wrap:focus-within { border-color: var(--primary); }
.composer-label { color: var(--pewter); font: 600 10px var(--font-ui); letter-spacing: .2em; }
.composer-input-wrap input { width: 100%; height: 43px; padding: 0 0 5px; background: transparent; color: var(--foreground); border: 0; outline: none; font: italic 26px var(--font-display); }
.composer-input-wrap input::placeholder { color: var(--muted-foreground); opacity: .8; }
.composer-input-wrap input:disabled { opacity: .6; }
.btn-story { display: inline-flex; align-items: center; gap: 10px; flex: none; margin-bottom: 1px; padding: 12px 22px; background: var(--primary); color: var(--background); border: 1px solid var(--primary); cursor: pointer; font: 600 11px var(--font-ui); letter-spacing: .18em; transition: background .25s, color .25s; }
.btn-story:hover:not(:disabled) { background: transparent; color: var(--primary); }
.btn-story:disabled { opacity: .5; cursor: default; }
.btn-story svg { width: 17px; height: 17px; }
.error-message { margin: 0 0 13px; color: var(--destructive); font: 13px/1.4 var(--font-ui); }
.ended-controls { display: flex; justify-content: space-between; align-items: center; gap: 20px; color: var(--muted-foreground); font: italic 22px var(--font-display); }
.is-playing .scene-image-frame { height: clamp(145px, 19vw, 230px); }
.is-playing .scene-title { padding-bottom: 22px; }
.is-playing .scene h1 { font-size: clamp(50px, 5.5vw, 72px); }
.transcript { width: min(100%, 660px); margin: 0 auto; padding: 44px 0 16px; }
.transcript-heading { margin-bottom: 35px; }
.entry { margin: 0 0 30px; animation: reveal .4s ease-out both; }
.entry p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 18px/1.8 var(--font-body); }
.entry-narration:first-of-type p::first-letter { float: left; margin: 3px 8px 0 0; font: 400 58px/.8 var(--font-display); color: var(--primary); }
.entry-say { padding: 12px 0 12px 25px; border-left: 1px solid var(--pewter); }
.entry-say p { font: italic 27px/1.3 var(--font-display); }
.entry-speaker { margin-bottom: 8px; color: var(--primary); font: 600 10px var(--font-ui); text-transform: uppercase; letter-spacing: .2em; }
.entry-you { margin-left: 10%; padding: 14px 0 14px 22px; border-left: 1px solid var(--primary); }
.entry-you .entry-speaker { color: var(--pewter); }
.entry-you p { font-size: 16px; }
.ending { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 25px 0; color: var(--primary); font: 11px var(--font-ui); letter-spacing: .3em; }
.ending-decoration { font-size: 15px; }
.loading-line { display: flex; align-items: center; gap: 10px; color: var(--muted-foreground); font: italic 23px var(--font-display); }
.loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 50% { opacity: .3; } }
@media (min-width: 900px) and (min-height: 850px) {
  .scene-image-frame { height: min(33vh, 375px); }
  .welcome-content { padding-top: 52px; padding-bottom: 38px; }
}
@media (max-width: 640px) {
  .site-header { height: 56px; }
  .site-header-inner { padding: 0 20px; }
  .wordmark { font-size: 23px; gap: 10px; }
  .wordmark-mark { width: 30px; height: 30px; }
  .header-edition { display: none; }
  .restart-button span { display: none; }
  .scene-image-frame { height: auto; aspect-ratio: 735 / 265; }
  .scene-title { padding: 19px 22px 29px; }
  .scene h1 { font-size: 65px; }
  .reading-area { padding: 0 22px; }
  .welcome-content { padding: 36px 0 26px; }
  .welcome-content h2 { font-size: 40px; }
  .welcome-description { font-size: 15px; }
  .composer-wrap { padding: 0 22px 38px; }
  .composer-form { align-items: stretch; flex-direction: column; gap: 18px; }
  .composer-form .btn-story { align-self: flex-start; }
  .is-playing .scene-image-frame { height: auto; aspect-ratio: 735 / 230; }
  .is-playing .scene-title { padding: 16px 22px 22px; }
  .is-playing .scene h1 { font-size: 52px; }
  .transcript { padding-top: 34px; }
  .entry p { font-size: 16px; }
  .entry-say p { font-size: 24px; }
}
@media (max-width: 360px) {
  .scene h1 { font-size: 56px; }
  .welcome-content h2 { font-size: 34px; }
  .composer-label { font-size: 9px; }
  .ended-controls { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="game-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <button class="wordmark" id="wordmark" aria-label="Varenmoor home">
        <span class="wordmark-mark" aria-hidden="true"><img src="favicon.svg" alt=""></span><span>Varenmoor</span>
      </button>
      <div class="header-right">
        <span class="header-edition">AN INTERACTIVE GOTHIC TALE</span>
        <button class="restart-button" id="restart-header" hidden title="Begin a new story" aria-label="Begin a new story">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Begin again</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content" id="main">
    <section class="scene" aria-label="Varenmoor — a note from the narrator">
      <div class="scene-image-frame">
        <img src="varenmoor.jpg" alt="A last note from your narrator: I am haunted by humans." width="735" height="265" class="scene-image">
      </div>
      <div class="scene-title">
        <div class="chapter-label"><span class="chapter-rule"></span> <span>THE FIRST PAGE</span></div>
        <h1>Varenmoor</h1>
      </div>
    </section>

    <section class="reading-area" id="reading-area" aria-label="Begin the story">
      <div class="welcome-content" id="welcome">
        <p class="section-label">BEFORE YOU ENTER</p>
        <h2>Every story starts with a name.</h2>
        <p class="welcome-description">Beyond the water, the gates of Varenmoor stand open. What happens next is yours to discover.</p>
      </div>
      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions" hidden>
        <div class="transcript-heading"><span class="chapter-rule"></span><span>THE STORY SO FAR</span></div>
        <div id="entries"></div>
        <div class="loading-line" id="loading" role="status" hidden><span class="loading-dot"></span> The castle is listening…</div>
        <div id="transcript-end"></div>
      </div>
    </section>
  </main>

  <div class="composer-wrap">
    <div class="composer-inner">
      <p class="error-message" id="error" role="alert" hidden></p>
      <div class="ended-controls" id="ended-controls" hidden>
        <span>The story has come to an end.</span>
        <button class="btn-story" id="restart-ended">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Begin again
        </button>
      </div>
      <form class="composer-form" id="composer">
        <label class="composer-input-wrap">
          <span class="composer-label" id="composer-label">WHAT SHALL WE CALL YOU?</span>
          <input id="input" autocomplete="off" aria-label="Your name (optional)" placeholder="Your name, if you wish…">
        </label>
        <button type="submit" class="btn-story" id="submit">
          <span id="submit-text">BEGIN STORY</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  var sessionId = null;
  var busy = false;
  var ended = false;

  var main = document.getElementById('main');
  var welcome = document.getElementById('welcome');
  var transcript = document.getElementById('transcript');
  var entriesEl = document.getElementById('entries');
  var loading = document.getElementById('loading');
  var transcriptEnd = document.getElementById('transcript-end');
  var errorEl = document.getElementById('error');
  var composer = document.getElementById('composer');
  var composerLabel = document.getElementById('composer-label');
  var input = document.getElementById('input');
  var submitBtn = document.getElementById('submit');
  var submitText = document.getElementById('submit-text');
  var endedControls = document.getElementById('ended-controls');
  var restartHeader = document.getElementById('restart-header');

  function apiBase() {
    return (window.VARENMOOR_API || 'https://varenmoor-api.onrender.com').replace(/\/$/, '');
  }

  function request(path, body) {
    return fetch(apiBase() + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (result) {
        if (!response.ok) throw new Error(result.detail || 'The castle did not answer (' + response.status + ').');
        return result;
      });
    });
  }

  function scrollToEnd() {
    transcriptEnd.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function addEntry(entry) {
    var div = document.createElement('div');
    div.className = 'entry entry-' + entry.kind;
    if (entry.kind === 'say' || entry.kind === 'you') {
      var speaker = document.createElement('div');
      speaker.className = 'entry-speaker';
      speaker.textContent = entry.kind === 'you' ? 'YOU' : entry.speaker;
      div.appendChild(speaker);
    }
    if (entry.kind === 'end') {
      var ending = document.createElement('div');
      ending.className = 'ending';
      ending.innerHTML = '<span class="ending-decoration">✦</span><span>THE END</span><span class="ending-decoration">✦</span>';
      div.appendChild(ending);
    } else {
      var p = document.createElement('p');
      p.textContent = entry.text;
      div.appendChild(p);
    }
    entriesEl.appendChild(div);
  }

  function mapEvents(events) {
    return events.map(function (event) {
      if (event.kind === 'narration') return { kind: 'narration', text: event.text };
      if (event.kind === 'say') return { kind: 'say', text: event.text, speaker: event.speaker };
      return { kind: 'end', text: 'The end' };
    });
  }

  function setBusy(value) {
    busy = value;
    loading.hidden = !value;
    input.disabled = value;
    submitBtn.disabled = value || (sessionId && !input.value.trim());
    submitText.textContent = value ? 'WAITING' : (sessionId ? 'SEND' : 'BEGIN STORY');
    scrollToEnd();
  }

  function setEnded(value) {
    ended = value;
    endedControls.hidden = !value;
    composer.hidden = value;
  }

  function setPlaying(value) {
    main.classList.toggle('is-playing', value);
    welcome.hidden = value;
    transcript.hidden = !value;
    restartHeader.hidden = !value && !ended;
    composerLabel.textContent = value ? 'DICTATE YOUR PATH' : 'WHAT SHALL WE CALL YOU?';
    input.placeholder = value ? 'What do you say or do?' : 'Your name, if you wish…';
    input.setAttribute('aria-label', value ? 'What do you say or do?' : 'Your name (optional)');
  }

  composer.addEventListener('submit', function (event) {
    event.preventDefault();
    if (busy || ended) return;
    var message = input.value.trim();
    if (sessionId && !message) return;

    setBusy(true);
    errorEl.hidden = true;

    var call = !sessionId
      ? request('/api/session', { player: message }).then(function (result) {
          sessionId = result.session_id;
          setPlaying(true);
          mapEvents(result.events).forEach(addEntry);
          setEnded(result.events.some(function (e) { return e.kind === 'end'; }));
        })
      : request('/api/session/' + encodeURIComponent(sessionId) + '/message', { text: message }).then(function (result) {
          addEntry({ kind: 'you', text: message });
          mapEvents(result.events).forEach(addEntry);
          setEnded(result.events.some(function (e) { return e.kind === 'end'; }));
        });

    call.catch(function (caught) {
      errorEl.textContent = caught instanceof Error ? caught.message : 'Something went wrong. Please try again.';
      errorEl.hidden = false;
    }).finally(function () {
      input.value = '';
      setBusy(false);
      input.focus();
      scrollToEnd();
    });
  });

  function restart() {
    sessionId = null;
    entriesEl.innerHTML = '';
    input.value = '';
    errorEl.hidden = true;
    setEnded(false);
    setPlaying(false);
    setBusy(false);
    input.focus();
  }

  document.getElementById('restart-ended').addEventListener('click', restart);
  restartHeader.addEventListener('click', restart);
  document.getElementById('wordmark').addEventListener('click', function () {
    if (sessionId || ended) restart();
  });
})();
</script>
</body>
</html>
