[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varenmoor"
version = "0.2.0"
description = "A multi-agent gothic-horror text game built on LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
varenmoor = "varenmoor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
varenmoor = ["story/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
